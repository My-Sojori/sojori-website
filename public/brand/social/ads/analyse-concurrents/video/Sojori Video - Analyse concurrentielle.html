<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sojori — Vidéo Analyse concurrentielle (1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#1c1a16;height:100%}
  #root{min-height:100vh}
  *{box-sizing:border-box}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- scene list (host-editable timing) -->
<script>window.OM_SCENES = '[{"name":"Hook","dur":3},{"name":"Revenu","dur":3},{"name":"Calendrier","dur":2.8},{"name":"Concurrents","dur":3},{"name":"Duel","dur":3.6},{"name":"Bilan","dur":3},{"name":"CTA","dur":3}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
<script>window.OM_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"motionEditor": true}/*EDITMODE-END*/;</script>

<script type="text/babel" src="animations-v2.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel">
const { SceneStage } = window;
const { useTweaks } = window;

function App(){
  const [t, setTweak] = useTweaks(window.OM_TWEAK_DEFAULTS);
  const S = window.SOJORI_SCENES;
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <SceneStage
        width={1080} height={1920}
        scenes={window.OM_SCENES}
        playback={window.OM_PLAYBACK}
        bg="#F7F3EA"
        showEditor={t.motionEditor}>
        {{ Hook:S.Hook, Revenu:S.Revenu, Calendrier:S.Calendrier, Concurrents:S.Concurrents, Duel:S.Duel, Bilan:S.Bilan, CTA:S.CTA }}
      </SceneStage>
      <window.TweaksPanel>
        <window.TweakSection label="Montage"/>
        <window.TweakToggle label="Motion editor" value={t.motionEditor} onChange={v=>setTweak('motionEditor',v)}/>
      </window.TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
